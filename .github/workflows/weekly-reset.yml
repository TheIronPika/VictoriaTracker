name: Weekly Habit Reset

on:
  schedule:
    # Monday 4:00 AM Central — PROPOSE: compute nothing, just flag the week
    # as ready and let the native app prompt Victoria to approve or snooze.
    # 9:00 UTC = 4:00 AM CDT (summer) / 3:00 AM CST (winter)
    - cron: '0 9 * * 1'
    # Monday 7:00 PM Central — FORCE: if she never approved, run the actual
    # reset anyway so payouts/history can't stall indefinitely.
    # 00:00 UTC Tue = 7:00 PM CDT (summer) / 6:00 PM CST (winter)
    - cron: '0 0 * * 2'

  # Allow manual trigger from GitHub Actions tab for testing
  workflow_dispatch:
    inputs:
      mode:
        description: 'Reset mode'
        required: true
        default: propose
        type: choice
        options:
          - propose
          - force

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Determine reset mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * 1" ]; then
            echo "value=propose" >> "$GITHUB_OUTPUT"
          else
            echo "value=force" >> "$GITHUB_OUTPUT"
          fi

      - name: Run weekly reset
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RESET_MODE: ${{ steps.mode.outputs.value }}
        run: node reset.js
        working-directory: scripts
